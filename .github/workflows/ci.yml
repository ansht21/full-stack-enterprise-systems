name: Full-Stack Monorepo CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  warehouse-backend-test:
    name: Warehouse Backend (Java 21 / Spring Boot) Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run 19 Unit Tests
        run: mvn clean test -f "Warehouse Inventory Management System/backend/pom.xml"

  warehouse-frontend-build:
    name: Warehouse Frontend (React 18 / Vite) Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Warehouse Inventory Management System/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: 'Warehouse Inventory Management System/frontend'
        run: npm ci

      - name: Build Production Assets
        working-directory: 'Warehouse Inventory Management System/frontend'
        run: npm run build
