server:
  port: 8080

spring:
  application:
    name: warehouse-inventory-management
  datasource:
    url: jdbc:mysql://localhost:3306/warehouse_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# JWT configuration
app:
  jwt:
    # Base64-encoded 256-bit secret. Override in production via APP_JWT_SECRET env var.
    secret: ${APP_JWT_SECRET:c2VjcmV0LWtleS1mb3Itd2FyZWhvdXNlLWludmVudG9yeS1tYW5hZ2VtZW50LXN5c3RlbS0yMDI1}
    expiration-ms: 86400000  # 24 hours
  upload:
    dir: ${UPLOAD_DIR:uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: INFO
